  <script>
    function updateCheckoutLinkCount() {
      const checkoutLink = document.getElementById('checkout-link');
      if (!checkoutLink) return;
      const cart = JSON.parse(localStorage.getItem('cart')) || {};
      const total = Object.values(cart).reduce((sum, item) => sum + (item.qty || 0), 0);
      if (total > 0) {
        checkoutLink.innerHTML = `<i class="fas fa-shopping-cart"></i><span class="cart-badge">${total}</span>`;
      } else {
        checkoutLink.innerHTML = `<i class="fas fa-shopping-cart"></i>`;
      }
    }
    updateCheckoutLinkCount();
    window.addEventListener('storage', updateCheckoutLinkCount);
  </script>

<script src="app.js"></script>
<script>
  // Dynamic Theme Switcher for Categories
  const categoryBtns = document.querySelectorAll('.cat-btn');
  categoryBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // Clear existing themes
      document.body.classList.remove('kids-theme', 'men-theme', 'women-theme');
      
      // Apply new theme based on category
      const cat = e.target.dataset.cat;
      if (cat === 'kids') {
        document.body.classList.add('kids-theme');
      } else if (cat === 'men') {
        document.body.classList.add('men-theme');
      } else if (cat === 'women') {
        document.body.classList.add('women-theme');
      }
    });
  });
</script>
