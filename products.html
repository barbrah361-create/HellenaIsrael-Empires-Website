  <link rel="stylesheet" href="Css/styl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<header>
  <a href="index.html" class="logo-container">
    <img src="image/my logo - Copy.jpeg" alt="Logo" class="logo">
    <h1>Hellenaisrael Authentic Cosmetic Empire</h1>
  </a>
  <div class="social-icons">
    <div class="social-links">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="https://wa.me/254717263203"><i class="fab fa-whatsapp"></i></a>
    </div>
    <button id="menu-btn" class="menu-btn" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="skintype.html">Skin Discovery</a>
    <a id="checkout-link" href="checkout.html">Checkout</a>

  </nav>
</header>

<section class="products-section">
  <div class="products-header">
    <h2>Our Products</h2>
    <div class="product-search">
      <input id="product-search-input" type="search" placeholder="Search products..." aria-label="Search products">
    </div>
  </div>
  
  <div class="category-filters">
    <button class="cat-btn active" data-cat="all">All Products</button>
    <button class="cat-btn" data-cat="women">Women</button>
    <button class="cat-btn" data-cat="men">Men</button>
    <button class="cat-btn" data-cat="kids">Kids</button>
  </div>
  <div class="products-grid" id="products-grid"></div>
</section>

<a href="https://wa.me/254717263203" class="whatsapp-btn">
  <i class="fab fa-whatsapp"></i>
</a>

<!-- Product Details Modal -->
<div id="product-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div class="modal-body">
      <div class="modal-image-wrapper">
        <img id="modal-image" src="" alt="">
      </div>
      <div class="modal-details">
        <h2 id="modal-title"></h2>
        <p class="modal-price" id="modal-price"></p>
        <div class="modal-article" id="modal-article"></div>
        <div id="modal-cart-controls" class="cart-controls"></div>
      </div>
    </div>
  </div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
<script>
  // Dynamic Theme Switcher for Categories
  const categoryBtns = document.querySelectorAll('.cat-btn');
  categoryBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // Clear existing themes
      document.body.classList.remove('kids-theme', 'men-theme', 'women-theme');
      
      // Apply new theme based on category
      const cat = e.target.dataset.cat;
      if (cat === 'kids') {
        document.body.classList.add('kids-theme');
      } else if (cat === 'men') {
        document.body.classList.add('men-theme');
      } else if (cat === 'women') {
        document.body.classList.add('women-theme');
      }
    });
  });
</script>

</body>
</html>
