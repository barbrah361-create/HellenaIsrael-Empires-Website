<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Hellena Israel Empires</title>
  <link rel="icon" type="image/jpeg" href="image/my logo - Copy.jpeg">
  <link rel="stylesheet" href="Css/styl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Elegant, Minimalist Solid Color Background */
    body {
      background-color: #fcfbfa; /* Very soft elegant off-white */
      color: #3a3530; /* Dark brownish-grey text */
      font-family: 'Montserrat', sans-serif; /* Clean sans for body text */
    }

    .single-product-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 50px;
      background: #ffffff;
      border: 1px solid #efeae4;
      box-shadow: 0 10px 40px rgba(100, 85, 70, 0.05);
      display: flex;
      flex-direction: column;
      gap: 60px;
      animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (min-width: 800px) {
      .single-product-container {
        flex-direction: row;
        align-items: center;
      }
    }
    
    .single-product-image {
      flex: 1;
      position: relative;
      background: #faf8f5;
      padding: 50px;
      border: 1px solid #f2ece6;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.4s ease;
    }
    
    .single-product-image:hover {
      transform: scale(1.02);
    }
    
    .single-product-image img {
      max-width: 100%;
      height: auto;
      max-height: 550px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.05));
    }
    
    /* Watermark for single product page */
    .single-product-image::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25%;
      height: 25%;
      max-width: 100px;
      max-height: 100px;
      background: url('image/water mark.jpeg') no-repeat center;
      background-size: contain;
      opacity: 0.45;
      pointer-events: none;
      z-index: 20;
    }
    
    .single-product-details {
      flex: 1;
      padding: 0 20px;
    }
    
    .single-product-details h1 {
      font-size: 3rem;
      color: #3b3024;
      margin-bottom: 20px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(to right, #4a3f35, #9c7b4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    
    .single-product-details .price {
      font-size: 2rem;
      color: #9c7b4e;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      margin-bottom: 30px;
      display: inline-block;
      padding: 5px 0;
      border-bottom: 2px solid #e8decb;
    }
    
    .single-product-details .description {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #665f57;
      margin-bottom: 40px;
      font-weight: 300;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      color: #9c7b4e;
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
      transition: all 0.3s;
      border-bottom: 1px solid transparent;
    }
    
    .back-btn:hover {
      color: #4a3f35;
      border-bottom: 1px solid #4a3f35;
    }
    
    .error-msg {
      text-align: center;
      font-size: 1.5rem;
      color: #8a4a4a;
      padding: 60px;
      background: #fdfaf9;
      border: 1px solid #f2e6e6;
      margin: 40px auto;
      max-width: 600px;
      font-family: 'Cormorant Garamond', serif;
    }
    
    .single-product-controls {
      max-width: 350px;
      background: #faf8f5;
      padding: 20px;
      border: 1px solid #efeae4;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo-container">
    <img src="image/my logo - Copy.jpeg" alt="Hellena Israel Empires Logo" class="logo">
    <div class="site-title-h1">Hellenaisrael Authentic Cosmetics Empire</div>
  </a>
  <div class="social-icons">
    <div class="social-links">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="https://wa.me/254717263203"><i class="fab fa-whatsapp"></i></a>
    </div>
    <button id="menu-btn" class="menu-btn" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="skintype.html">Skin Discovery</a>
    <a id="checkout-link" href="checkout.html">Checkout</a>
  </nav>
  <script>
    function updateCheckoutLinkCount() {
      const checkoutLink = document.getElementById('checkout-link');
      if (!checkoutLink) return;
      const cart = JSON.parse(localStorage.getItem('cart')) || {};
      const total = Object.values(cart).reduce((sum, item) => sum + (item.qty || 0), 0);
      checkoutLink.textContent = total ? `Checkout (${total})` : 'Checkout';
    }
    updateCheckoutLinkCount();
    window.addEventListener('storage', updateCheckoutLinkCount);
  </script>
</header>

<main id="main-content" style="min-height: 60vh;">
  <!-- Product details will be injected here -->
</main>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-logo">
      <img src="image/my logo - Copy.jpeg" alt="Hellena Israel Empires Logo" class="logo-footer" loading="lazy">
      <h3>Hellena Israel Empires</h3>
    </div>
    <div class="footer-socials">
      <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://wa.me/254717263203" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p class="footer-text">© 2026 Hellenaisrael Authentic Cosmetics Empire. All rights reserved.</p>
  </div>
</footer>

<script src="app.js"></script>
<script src="products.js"></script>
<script>
  try {
    const urlParams = new URLSearchParams(window.location.search);
    let productId = urlParams.get('id');
    
    if (!productId) {
      productId = localStorage.getItem('selectedProductId');
    }
    
    const mainContent = document.getElementById('main-content');
    
    if (!productId) {
      mainContent.innerHTML = '<div class="error-msg">Product not found. <br>Error: Please select a product from the home page first.<br><br><a href="products.html" class="btn">Back to Products</a></div>';
    } else {
      // products array is loaded from products.js
      const product = products.find(p => p.id == productId);
      
      if (!product) {
        mainContent.innerHTML = '<div class="error-msg">Product not found. <br>Error: Could not find product with ID "' + productId + '" in our database.<br><br><a href="products.html" class="btn">Back to Products</a></div>';
      } else {
        document.title = product.name + " | Hellena Israel Empires";
        
        // Add Dynamic SEO Meta Tags
        const metaDesc = document.createElement('meta');
        metaDesc.name = "description";
        metaDesc.content = "Buy " + product.name + " at Hellena Israel Empires. Authentic premium cosmetics in Kenya.";
        document.head.appendChild(metaDesc);
        
        const ogTitle = document.createElement('meta');
        ogTitle.setAttribute('property', 'og:title');
        ogTitle.content = product.name;
        document.head.appendChild(ogTitle);
        
        // We get the quantity from the cart
        const cartObj = JSON.parse(localStorage.getItem('cart')) || {};
        const qty = cartObj[product.id] ? cartObj[product.id].qty : 0;
        
        const article = product.description ? product.description : "Experience luxury skincare designed to leave you feeling confident, refreshed, and beautifully authentic.";
        
        mainContent.innerHTML = `
          <div class="single-product-container">
            <div class="single-product-image">
              <img src="${product.image}" alt="${product.name.replace(/"/g, '&quot;')}">
            </div>
            <div class="single-product-details">
              <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Shopping</a>
              <h1>${product.name}</h1>
              <div class="price">Ksh ${product.price}</div>
              <div class="description">${article}</div>
              
              <div class="single-product-controls cart-controls">
                <button class="dec-btn" onclick="decreaseSingleQty(${product.id})" ${qty === 0 ? "disabled" : ""}>-</button>
                <span class="qty" id="single-qty">${qty}</span>
                <button class="add-cart-btn ${qty > 0 ? "plus-btn" : ""}" onclick='increaseSingleQty(${product.id}, ${JSON.stringify(product.name).replace(/'/g, "&#39;")}, ${product.price}, "${product.image}")'>
                  ${qty === 0 ? "Add to Cart" : "+"}
                </button>
              </div>
            </div>
          </div>
        `;
      }
    }
  } catch (err) {
    document.getElementById('main-content').innerHTML = '<div class="error-msg" style="color:red; padding: 50px;">Error rendering page: ' + err.message + '</div>';
    console.error("Rendering error: ", err);
  }
  
  // Custom functions to update the single product view immediately when added to cart
  window.increaseSingleQty = function(id, name, price, image) {
    if (typeof increaseQty === 'function') {
      increaseQty(id, name, price, image);
      refreshSingleQty(id);
    }
  };
  
  window.decreaseSingleQty = function(id) {
    if (typeof decreaseQty === 'function') {
      decreaseQty(id);
      refreshSingleQty(id);
    }
  };
  
  window.refreshSingleQty = function(id) {
    const cartObj = JSON.parse(localStorage.getItem('cart')) || {};
    const qty = cartObj[id] ? cartObj[id].qty : 0;
    
    const qtySpan = document.getElementById('single-qty');
    const decBtn = document.querySelector('.single-product-controls .dec-btn');
    const addBtn = document.querySelector('.single-product-controls .add-cart-btn');
    
    if (qtySpan) qtySpan.textContent = qty;
    
    if (decBtn) {
      if (qty === 0) decBtn.setAttribute('disabled', 'true');
      else decBtn.removeAttribute('disabled');
    }
    
    if (addBtn) {
      if (qty > 0) {
        addBtn.classList.add('plus-btn');
        addBtn.textContent = "+";
      } else {
        addBtn.classList.remove('plus-btn');
        addBtn.textContent = "Add to Cart";
      }
    }
  };
</script>
</body>
</html>
