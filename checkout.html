  <script>
    function updateCheckoutLinkCount() {
      const checkoutLink = document.getElementById('checkout-link');
      if (!checkoutLink) return;
      const cart = JSON.parse(localStorage.getItem('cart')) || {};
      const total = Object.values(cart).reduce((sum, item) => sum + (item.qty || 0), 0);
      checkoutLink.textContent = total ? `Checkout (${total})` : 'Checkout';
    }
    updateCheckoutLinkCount();
    window.addEventListener('storage', updateCheckoutLinkCount);
  </script>
</header>


<section class="hero checkout-hero">

  <h3>Total: Ksh <span id="total-amount">0</span></h3>

  <button id="send-whatsapp" class="whatsapp-btn"><i class="fab fa-whatsapp"></i> Send Order</button>
</section>

<script src="checkout.js"></script>
